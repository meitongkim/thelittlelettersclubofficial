  constructor(props) { super(props); this.state = { open: false, sent: false, err: '' }; }
  openSub(email) {
    try { this.lastFocus = document.activeElement; } catch (e) {}
    this.setState({ open: true, sent: false, err: '' }, () => {
      try {
        const em = document.getElementById('sub-email'); if (em && email) em.value = email;
        const f = document.getElementById('sub-first'); f && f.focus();
      } catch (e) {}
    });
  }
  closeSub() { this.setState({ open: false }, () => { try { this.lastFocus && this.lastFocus.focus && this.lastFocus.focus(); } catch (e) {} }); }
  renderVals() {
    return {
      open: this.state.open, sent: this.state.sent, notSent: !this.state.sent, err: this.state.err,
      openSub: () => this.openSub(''),
      quick: (e) => { e.preventDefault(); const v = (e.target.elements.email || {}).value || ''; this.openSub(v); },
      close: () => this.closeSub(),
      backdrop: (e) => { if (e.target === e.currentTarget) this.closeSub(); },
      key: (e) => {
        if (e.key === 'Escape') { e.preventDefault(); this.closeSub(); }
        else if (e.key === 'Tab') { // keep focus inside the dialog
          const panel = document.querySelector('.sub-panel'); if (!panel) return;
          const els = panel.querySelectorAll('button, a[href], input, [tabindex]:not([tabindex="-1"])');
          const first = els[0], last = els[els.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      },
      // Integration point: send these fields to the mailing-list service, and only show a
      // "thank you for subscribing" message once it succeeds. Record both consent ticks with a timestamp.
      submit: (e) => {
        e.preventDefault();
        const f = e.target.elements;
        if (!f.first.value.trim() || !f.last.value.trim()) return this.setState({ err: 'Please add your first and last name.' });
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email.value.trim())) return this.setState({ err: 'Please enter a valid email address.' });
        if (!f.store.checked) return this.setState({ err: 'Please tick the box to let us store your details, so we can send updates.' });
        this.setState({ sent: true, err: '' }, () => { try { const d = document.getElementById('sub-done'); d && d.focus(); } catch (er) {} });
      }
    };
  }
}

return Component;

        { id: 'chapters', label: 'Our Chapters', hint: 'One little world, many communities', href: '/chapters/' },
        { id: 'chapters-sg', label: '🇸🇬 Singapore', hint: 'Home Chapter', href: '/about/' },

        { id: 'chapters-start', label: '＋ Start a Chapter', hint: 'Tell us where the next letter should travel', href: '/contact/' }
      ] },
      { id: 'lbx', label: 'Letterbox', items: [
        { id: 'letterbox', label: 'Create a Letter', hint: 'Write and decorate an e-letter', href: '/letterbox/#studio' },
        { id: 'myletters', label: 'My Letters', hint: 'Your saved and sent letters', soon: true },
        { id: 'lbarchive', label: 'Community Archive', hint: 'Letters shared with permission', soon: true },
        { id: 'lbhow', label: 'How It Works', hint: 'From draft to delivery', soon: true }
      ] },
      { id: 'more', label: 'Explore', items: [
        { id: 'journal', label: 'Journal', hint: 'Stories, ideas and prompts', href: '/journal/' },
        { id: 'impact', label: 'Our Impact', hint: 'Verified figures only', href: '/remote/#impact' },
        { id: 'gallery', label: 'Little Moments', hint: 'Our Polaroid gallery', href: '/gallery/' },
        { id: 'scrapbook', label: 'Our Little Scrapbook', hint: 'Moments from our little corner', soon: true }
      ] },
      { id: 'contact', label: 'Contact', href: '/contact/' }
    ];
    const groups = tree.map((g) => {
      if (!g.items) return { label: g.label, href: g.href, isLink: true, isMenu: false, cur: g.id === current ? 'page' : undefined };
      const inGroup = g.items.some((i) => i.id === current);
      const isOpen = this.state.group === g.id;
      return {
        label: g.label, isLink: false, isMenu: true, cur: inGroup ? 'true' : undefined, show: isOpen, expanded: isOpen ? 'true' : 'false',
        toggle: () => this.setState({ group: isOpen ? null : g.id }),
        items: g.items.map((i) => ({ ...i, live: !i.soon, soon: !!i.soon, liCls: i.all ? 'dd__all' : '', cur: i.id === current ? 'page' : undefined }))
      };
    });
    const open = this.state.open;
    return {
      groups,
      open,
      expanded: open ? 'true' : 'false',
      menuLabel: open ? 'Close menu' : 'Open menu',
      toggle: () => this.setState({ open: !this.state.open })
    };
  }
}

return Component;
});
TLLC.define("SupportUs", function (DCLogic) {

// The Little Giving Circle is PROPOSED. No payments are collected; the form only drafts an email.
const TO = 'partnerships@thelittlelettersclub.org';
const WAYS = [
  { id: 'materials', t: 'In-kind materials', d: 'Paper, envelopes, stationery, craft kits and printing.', note: 'The quickest way to help a first workshop.', img: '/assets/0752dc1160693fa439243428c04f11e4.png', tone: 'llc-card--pink' },
  { id: 'sponsor', t: 'Project sponsorship', d: 'Materials, transport and approved workshop expenses for one project.', note: 'Tied to a named project and its budget.', img: '/assets/a7627d47e6d0acfc3f8a3b24eef7ea88.png', tone: 'llc-card--sunny' },
  { id: 'skills', t: 'Skills sponsorship', d: 'Design, printing, photography, training or technical support.', note: 'Your expertise, given as time or services.', img: '/assets/bceb9e4925691b876bad2e3b82653b97.png', tone: 'llc-card--sage' },
  { id: 'financial', t: 'Financial donations', d: 'Approved project costs and essential organisational expenses.', note: 'Not open yet. See “Where we are today” below.', img: '/assets/2227f28ccba20782244efc7a2abf7b3b.png', tone: 'llc-card--sky' }
];
const PACKS = [
  { kicker: 'Founding activity 001', t: 'The First Little Letter', d: 'Our founding team’s first craft and content session: cards, letters, bookmarks and postcards.', covers: ['Card stock, envelopes and writing paper', 'Markers, washi tape and stickers', 'Storage and packing for the finished collection'] },
  { kicker: 'Proposed first event', t: 'Letters & Little Blooms', d: 'A two-hour intergenerational workshop with a community partner, once confirmed.', covers: ['Workshop materials for volunteers and seniors', 'Approved transport and venue costs', 'Printing of activity sheets'] },
  { kicker: 'Seasons of Kindness', t: 'A seasonal collection', d: 'Letters and small creations for an approved seasonal campaign.', covers: ['Stationery and decorations', 'Packing and delivery through the partner'] },
  { kicker: 'The Little Library', t: 'A printed learning resource', d: 'Turning volunteer-made booklets or activity sheets into printed copies.', covers: ['Printing and binding', 'Editorial review before print'] }
];
const WHO = [
  { t: 'Stationery and craft retailers', d: 'Envelopes, card stock, markers, coloured paper, ribbons and craft kits for our first workshop.' },
  { t: 'Printing and publishing businesses', d: 'Discounted printing, postcards, booklets or activity sheets made from volunteer designs.' },
  { t: 'Community spaces and educational organisations', d: 'Workshop space, training, facilitators or help with logistics.' },
  { t: 'Digital and professional services', d: 'Software, technical mentoring, web support, photography or graphic design.' }
];
const TYPES = [['sponsor', 'Sponsor a project'], ['materials', 'Contribute materials'], ['skills', 'Offer skills or services'], ['partner', 'Explore a partnership']];
const BLANK = { type: '', org: '', name: '', email: '', what: '', q: '', ok: false };

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { v: { ...BLANK }, e: {}, ready: false }; }
  set(k, val) { this.setState({ v: { ...this.state.v, [k]: val }, e: { ...this.state.e, [k]: undefined } }); }
  prepare(ev) {
    if (ev && ev.preventDefault) ev.preventDefault();
    const v = this.state.v; const e = {};
    if (!v.type) e.type = 'Choose how you’d like to help.';
    if (!v.name.trim()) e.name = 'Please add your name.';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email.trim())) e.email = 'Please enter a valid email address.';
    if (!v.ok) e.ok = 'Please tick this so we can reply to you.';
    if (Object.keys(e).length) { this.setState({ e }); return; }
    this.setState({ ready: true, e: {} });
  }
  renderVals() {
    const s = this.state; const v = s.v;
    const h = {}; Object.keys(BLANK).forEach((k) => { h[k] = (ev) => this.set(k, k === 'ok' ? ev.target.checked : ev.target.value); });
    const typeLabel = (TYPES.find((t) => t[0] === v.type) || ['', ''])[1];
    const subject = 'Little Giving Circle: ' + typeLabel + (v.org.trim() ? ' (' + v.org.trim() + ')' : '');
    const draft = ['Hello TLLC partnerships team,', '', 'I’d like to: ' + typeLabel + '.', 'Organisation: ' + (v.org.trim() || 'Individual'), 'Name: ' + v.name.trim(), 'Email: ' + v.email.trim(), 'Amount, materials or services: ' + (v.what.trim() || 'Not sure yet'), '', 'Questions: ' + (v.q.trim() || 'None'), '', 'Thank you!'].join('\n');
    const pick = (id) => () => this.set('type', id);
    return {
      ways: WAYS.map((w) => ({ ...w, cls: 'llc-card gc-way ' + w.tone })),
      packs: PACKS, who: WHO, v, h, e: s.e,
      types: TYPES.map(([id, l]) => ({ l, on: v.type === id, pick: pick(id) })),
      pickSponsor: pick('sponsor'), pickMaterials: pick('materials'), pickPartner: pick('partner'),
      prepare: (ev) => this.prepare(ev), notReady: !s.ready, ready: s.ready, draft,
      mail: 'mailto:' + TO + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(draft),
      edit: () => this.setState({ ready: false })
    };
  }
}

return Component;
});
