TLLC.define("Footer", function (DCLogic) {

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: false, sent: false, err: '' }; }
  openSub(email) {
    try { this.lastFocus = document.activeElement; } catch (e) {}
    this.setState({ open: true, sent: false, err: '' }, () => {
      try {
        const em = document.getElementById('sub-email'); if (em && email) em.value = email;
        const f = document.getElementById('sub-first'); f && f.focus();
      } catch (e) {}
    });
  }
  closeSub() { this.setState({ open: false }, () => { try { this.lastFocus && this.lastFocus.focus && this.lastFocus.focus(); } catch (e) {} }); }
  renderVals() {
    return {
      open: this.state.open, sent: this.state.sent, notSent: !this.state.sent, err: this.state.err,
      openSub: () => this.openSub(''),
      quick: (e) => { e.preventDefault(); const v = (e.target.elements.email || {}).value || ''; this.openSub(v); },
      close: () => this.closeSub(),
      backdrop: (e) => { if (e.target === e.currentTarget) this.closeSub(); },
      key: (e) => {
        if (e.key === 'Escape') { e.preventDefault(); this.closeSub(); }
        else if (e.key === 'Tab') { // keep focus inside the dialog
          const panel = document.querySelector('.sub-panel'); if (!panel) return;
          const els = panel.querySelectorAll('button, a[href], input, [tabindex]:not([tabindex="-1"])');
          const first = els[0], last = els[els.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      },
      // Integration point: send these fields to the mailing-list service, and only show a
      // "thank you for subscribing" message once it succeeds. Record both consent ticks with a timestamp.
      submit: (e) => {
        e.preventDefault();
        const f = e.target.elements;
        if (!f.first.value.trim() || !f.last.value.trim()) return this.setState({ err: 'Please add your first and last name.' });
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email.value.trim())) return this.setState({ err: 'Please enter a valid email address.' });
        if (!f.store.checked) return this.setState({ err: 'Please tick the box to let us store your details, so we can send updates.' });
        this.setState({ sent: true, err: '' }, () => { try { const d = document.getElementById('sub-done'); d && d.focus(); } catch (er) {} });
      }
    };
  }
}

return Component;
});
