TLLC.define("Footer", function (DCLogic) {

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: false, sent: false, err: '' }; }
  openSub(email) {
    try { this.lastFocus = document.activeElement; } catch (e) {}
    this.setState({ open: true, sent: false, err: '' }, () => {
      try {
        const em = document.getElementById('sub-email'); if (em && email) em.value = email;
        const f = document.getElementById('sub-first'); f && f.focus();
      } catch (e) {}
    });
  }
  closeSub() { this.setState({ open: false }, () => { try { this.lastFocus && this.lastFocus.focus && this.lastFocus.focus(); } catch (e) {} }); }
  renderVals() {
    return {
      open: this.state.open, sent: this.state.sent, notSent: !this.state.sent, err: this.state.err,
      openSub: () => this.openSub(''),
      quick: (e) => { e.preventDefault(); const v = (e.target.elements.email || {}).value || ''; this.openSub(v); },
      close: () => this.closeSub(),
      backdrop: (e) => { if (e.target === e.currentTarget) this.closeSub(); },
      key: (e) => {
        if (e.key === 'Escape') { e.preventDefault(); this.closeSub(); }
        else if (e.key === 'Tab') { // keep focus inside the dialog
          const panel = document.querySelector('.sub-panel'); if (!panel) return;
          const els = panel.querySelectorAll('button, a[href], input, [tabindex]:not([tabindex="-1"])');
          const first = els[0], last = els[els.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      },
      // Integration point: send these fields to the mailing-list service, and only show a
      // "thank you for subscribing" message once it succeeds. Record both consent ticks with a timestamp.
      submit: (e) => {
        e.preventDefault();
        const f = e.target.elements;
        if (!f.first.value.trim() || !f.last.value.trim()) return this.setState({ err: 'Please add your first and last name.' });
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email.value.trim())) return this.setState({ err: 'Please enter a valid email address.' });
        if (!f.store.checked) return this.setState({ err: 'Please tick the box to let us store your details, so we can send updates.' });
        this.setState({ sent: true, err: '' }, () => { try { const d = document.getElementById('sub-done'); d && d.focus(); } catch (er) {} });
      }
    };
  }
}

return Component;
});

  { id: 'organise', e: '🌷', name: 'Community Companion', label: 'I want to organise 🌷', text: 'Help prepare projects and, where approved, local activities.' },
  { id: 'build', e: '🌱', name: 'Chapter Builder', label: 'I want to build the chapter 🌱', text: 'Help shape how TLLC India grows: ideas, research, planning.' }
];
const STEPS = ['Gather the founding community', 'Listen to local volunteers', 'Identify appropriate community partners', 'Co-design the first project', 'Train and brief volunteers', 'Create together', 'Reflect and improve'];
const JOURNAL = ['Building TLLC India from the beginning', 'Why young people still write letters', 'Meet a Little Creator', 'Behind a remote volunteering project', 'Notes from our first community collaboration'];
const ROUTE_TEXT = ['The letter starts its journey in Singapore, where TLLC began.', 'The little envelope is on its way.', 'It arrives in India, where young people shape TLLC for their own communities.'];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 0, openCard: null, sel: null, chosen: {}, sent: false, arrived: false };
  }
  componentDidMount() {
    const el = document.getElementById('arrive');
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!el || !('IntersectionObserver' in window) || reduce) { this.setState({ arrived: true }); return; }
    this.io = new IntersectionObserver((es) => { if (es.some((e) => e.isIntersecting)) { this.setState({ arrived: true }); this.io.disconnect(); } }, { threshold: 0.6 });
    this.io.observe(el);
  }
  componentWillUnmount() { if (this.io) this.io.disconnect(); }
  scrollTo(id) {
    const el = document.getElementById(id);
    if (!el) return;
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' });
  }
  renderVals() {
    const s = this.state;
    const open = CHAPTER.applicationsOpen;
    const tagMap = { dev: 'ch-tag ch-tag--dev', forming: 'ch-tag ch-tag--forming', future: 'ch-tag ch-tag--future' };
    const toggleTrack = (id) => this.setState({ chosen: { ...s.chosen, [id]: !s.chosen[id] } });
    return {
      step: String(s.step), atSg: s.step === 0 ? 'true' : 'false', atIn: s.step === 2 ? 'true' : 'false',
      goStart: () => this.setState({ step: 0 }), goMid: () => this.setState({ step: 1 }), goEnd: () => this.setState({ step: 2 }),
      routeText: ROUTE_TEXT[s.step], values: VALUES,
      status: [
        { k: 'Chapter status', v: '🌱 Forming' }, { k: 'Founding community', v: CHAPTER.founding },
        { k: 'Community partner', v: CHAPTER.partner }, { k: 'First project', v: CHAPTER.firstProject },
        { k: 'Volunteer applications', v: open ? 'OPEN' : 'CLOSED · interest list only' }
      ],
      cards: CARDS.map((c) => {
        const isOpen = s.openCard === c.id;
        return { ...c, cls: 'ch-card ch-card--' + c.cls, tagCls: tagMap[c.tag], open: isOpen ? 'true' : 'false', isOpen, note: isOpen && c.note ? c.note : '',
          more: isOpen ? 'Show less −' : 'See more +', toggle: () => this.setState({ openCard: isOpen ? null : c.id }) };
      }),
      people: [
        { slot: 'Sample slot · not a real person', name: 'Preferred name', role: 'Chapter role', place: 'City or state (optional)', tags: ['🌱 Founding Volunteer', '💌 Letter Writer'], quote: 'A short quote, in their own words.' },
        { slot: 'Sample slot · not a real person', name: 'Preferred name', role: 'Chapter role', place: 'City or state (optional)', tags: ['🎨 Little Maker', '📷 Storyteller'], quote: 'Shared only with their approval.' },
        { slot: 'Sample slot · not a real person', name: 'Preferred name', role: 'Chapter role', place: 'City or state (optional)', tags: ['🌷 Community Volunteer', '✨ Chapter Team'], quote: 'Optionally links to a profile page.' }
      ],
      letters: TRACKS.map((t) => ({ label: t.label, on: s.sel === t.id ? 'true' : 'false', pick: () => { this.setState({ sel: t.id }); this.scrollTo('track-' + t.id); } })),
      tracks: TRACKS.map((t) => ({ ...t, anchor: 'track-' + t.id, on: s.sel === t.id ? 'true' : 'false',
        btn: s.chosen[t.id] ? 'Added to my form ✓' : 'Choose this track',
        choose: () => { toggleTrack(t.id); this.setState({ sel: t.id }); } })),
      scripts: ['अ', 'அ', 'ਅ', 'অ', 'ا'],
      steps: STEPS.map((t, i) => ({ n: String(i + 1).padStart(2, '0'), t })),
      journal: JOURNAL,
      formTitle: open ? 'Join TLLC India' : 'Register your interest',
      formNote: open ? 'Tell us a little about you.' : 'Volunteer applications are not open yet. Leave your interest and we will tell you when they are.',
      formTracks: TRACKS.map((t) => ({ name: t.name, checked: !!s.chosen[t.id], toggle: () => toggleTrack(t.id) })),
      submitLabel: open ? 'Join TLLC India' : 'Register interest (prototype)',
      sent: s.sent,
      submit: (e) => { e.preventDefault(); this.setState({ sent: true }); },
      arrived: s.arrived ? 'true' : 'false'
    };
  }
}

return Component;
});
TLLC.start("India", document.getElementById('app'));
</script>
