  constructor(props) { super(props); this.state = { open: false, sent: false, err: '' }; }
  openSub(email) {
    try { this.lastFocus = document.activeElement; } catch (e) {}
    this.setState({ open: true, sent: false, err: '' }, () => {
      try {
        const em = document.getElementById('sub-email'); if (em && email) em.value = email;
        const f = document.getElementById('sub-first'); f && f.focus();
      } catch (e) {}
    });
  }
  closeSub() { this.setState({ open: false }, () => { try { this.lastFocus && this.lastFocus.focus && this.lastFocus.focus(); } catch (e) {} }); }
  renderVals() {
    return {
      open: this.state.open, sent: this.state.sent, notSent: !this.state.sent, err: this.state.err,
      openSub: () => this.openSub(''),
      quick: (e) => { e.preventDefault(); const v = (e.target.elements.email || {}).value || ''; this.openSub(v); },
      close: () => this.closeSub(),
      backdrop: (e) => { if (e.target === e.currentTarget) this.closeSub(); },
      key: (e) => {
        if (e.key === 'Escape') { e.preventDefault(); this.closeSub(); }
        else if (e.key === 'Tab') { // keep focus inside the dialog
          const panel = document.querySelector('.sub-panel'); if (!panel) return;
          const els = panel.querySelectorAll('button, a[href], input, [tabindex]:not([tabindex="-1"])');
          const first = els[0], last = els[els.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      },
      // Integration point: send these fields to the mailing-list service, and only show a
      // "thank you for subscribing" message once it succeeds. Record both consent ticks with a timestamp.
      submit: (e) => {
        e.preventDefault();
        const f = e.target.elements;
        if (!f.first.value.trim() || !f.last.value.trim()) return this.setState({ err: 'Please add your first and last name.' });
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email.value.trim())) return this.setState({ err: 'Please enter a valid email address.' });
        if (!f.store.checked) return this.setState({ err: 'Please tick the box to let us store your details, so we can send updates.' });
        this.setState({ sent: true, err: '' }, () => { try { const d = document.getElementById('sub-done'); d && d.focus(); } catch (er) {} });
      }
    };
  }
}

return Component;

        this.setLetter((M2) => { if (M2.attachments.song) M2.attachments.song.link = err ? '' : v; }); this.setState({ linkErr: err });
      },
      hasLinkErr: !!st.linkErr, linkErr: st.linkErr,
      volNote: st.volNote, onVolNote: (e) => set({ volNote: e.target.value }),
      // envelope, stamp, seal (layered SVG + small WebP)
      env: { back: env.layers.back.url, front: env.layers.front.url, flap: env.layers.flap.url },
      stampSrc: (R.resolve(L.stampId) || R.list('stamp')[0]).tiers.editor.url,
      sealSrc: (R.resolve(L.sealId) || R.resolve('seal.wax_heart@1')).tiers.editor.url,
      envelopes: R.list('envelope').map((e) => ({ label: e.label, front: e.layers.front.url, pressed: e.id === env.id ? 'true' : 'false', pick: () => this.setLetter((M2) => { M2.envelopeId = e.id; }) })),
      stamps: R.list('stamp').map((s) => ({ label: s.label, src: s.tiers.editor.url, pressed: s.id === L.stampId ? 'true' : 'false', pick: () => this.setLetter((M2) => { M2.stampId = s.id; }) })),
      // pathways
      paths: [
        { id: 'personal', title: 'Share personally', desc: 'A private link for someone you know.' },
        { id: 'collection', title: 'Send to a TLLC collection', desc: 'Reviewed, then delivered through a partner.' },
        { id: 'archive', title: 'Community archive', desc: 'Ask for it to be shown publicly after review.' }
      ].map((p) => ({ ...p, pressed: L.pathway === p.id ? 'true' : 'false', pick: () => { this.setLetter((M2) => { M2.pathway = p.id; }); set({ notice: '', arcErr: '' }); } })),
      isPersonal: L.pathway === 'personal', isCollection: L.pathway === 'collection', isArchive: L.pathway === 'archive',
      token: st.token,
      tryShare: () => { this.save(); set({ notice: 'Private links need the TLLC server, so no link was created and nothing left this device. When it is live, the link will look like the example above and can be switched off at any time.' }); },
      collChecks: [
        { ok: warnings.length === 0, text: 'No contact details, handles or links' },
        { ok: !hasPhotos, text: 'No personal photos (collections are words and stickers only)' },
        { ok: !song, text: 'No song link' },
        { ok: L.text.body.trim().length >= 40, text: 'A message of at least a few lines' },
        { ok: false, text: 'A collection is open for submissions (none yet)' }
      ].map((c) => ({ ...c, cls: c.ok ? 'ok' : 'no', mark: c.ok ? '✓' : '✕' })),
      arcName: st.arcName, arcAge: st.arcAge, arcPublic: st.arcPublic, arcClean: st.arcClean, arcGuardian: st.arcGuardian,
      arcMinor: st.arcAge === 'under-16' || st.arcAge === '16-17',
      onArcName: (e) => set({ arcName: e.target.value }), onArcAge: (e) => set({ arcAge: e.target.value, arcGuardian: false }),
      onArcPublic: (e) => set({ arcPublic: e.target.checked }), onArcClean: (e) => set({ arcClean: e.target.checked }), onArcGuardian: (e) => set({ arcGuardian: e.target.checked }),
      hasArcErr: !!st.arcErr, arcErr: st.arcErr,
      tryArchive: () => {
        const minor = st.arcAge === 'under-16' || st.arcAge === '16-17'; let err = '';
        if (!st.arcAge) err = 'Please choose an age band.';
        else if (!st.arcPublic) err = 'Public display needs your separate agreement.';
        else if (!st.arcClean) err = 'Please confirm there are no personal details.';
        else if (minor && !st.arcGuardian) err = 'Under 18s need a parent or guardian to agree.';
        else if (warnings.length) err = 'Please remove contact details from your letter first.';
        else if (L.text.body.trim().length < 40) err = 'Please write a few more lines first.';
        if (err) { set({ arcErr: err, notice: '' }); return; }
        this.save();
        set({ arcErr: '', notice: 'Your request passed every check, but archive requests need the TLLC server and a volunteer review, so nothing was sent or published.' });
      },
      hasNotice: !!st.notice, notice: st.notice,
      // storage + loading transparency
      letterJson: JSON.stringify(JSON.parse(json), null, 2),
      jsonKb: (json.length / 1024).toFixed(1) + ' KB', assetRefs: refs.size + ' IDs',
      loadedKb: Math.round(loadedBytes / 1024) + ' KB', loadedCount
    };
  }
}

return Component;
});
TLLC.start("Letterbox", document.getElementById('app'));
</script>
