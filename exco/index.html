TLLC.define("Footer", function (DCLogic) {

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: false, sent: false, err: '' }; }
  openSub(email) {
    try { this.lastFocus = document.activeElement; } catch (e) {}
    this.setState({ open: true, sent: false, err: '' }, () => {
      try {
        const em = document.getElementById('sub-email'); if (em && email) em.value = email;
        const f = document.getElementById('sub-first'); f && f.focus();
      } catch (e) {}
    });
  }
  closeSub() { this.setState({ open: false }, () => { try { this.lastFocus && this.lastFocus.focus && this.lastFocus.focus(); } catch (e) {} }); }
  renderVals() {
    return {
      open: this.state.open, sent: this.state.sent, notSent: !this.state.sent, err: this.state.err,
      openSub: () => this.openSub(''),
      quick: (e) => { e.preventDefault(); const v = (e.target.elements.email || {}).value || ''; this.openSub(v); },
      close: () => this.closeSub(),
      backdrop: (e) => { if (e.target === e.currentTarget) this.closeSub(); },
      key: (e) => {
        if (e.key === 'Escape') { e.preventDefault(); this.closeSub(); }
        else if (e.key === 'Tab') { // keep focus inside the dialog
          const panel = document.querySelector('.sub-panel'); if (!panel) return;
          const els = panel.querySelectorAll('button, a[href], input, [tabindex]:not([tabindex="-1"])');
          const first = els[0], last = els[els.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      },
      // Integration point: send these fields to the mailing-list service, and only show a
      // "thank you for subscribing" message once it succeeds. Record both consent ticks with a timestamp.
      submit: (e) => {
        e.preventDefault();
        const f = e.target.elements;
        if (!f.first.value.trim() || !f.last.value.trim()) return this.setState({ err: 'Please add your first and last name.' });
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email.value.trim())) return this.setState({ err: 'Please enter a valid email address.' });
        if (!f.store.checked) return this.setState({ err: 'Please tick the box to let us store your details, so we can send updates.' });
        this.setState({ sent: true, err: '' }, () => { try { const d = document.getElementById('sub-done'); d && d.focus(); } catch (er) {} });
      }
    };
  }
}

return Component;
});

  { n: 2, t: 'Role exercise', d: 'One small, role-specific task. Programmes, Partnerships and Creative each have their own.' },
  { n: 3, t: 'Conversation', d: 'A friendly 15–20 minute chat about reliability, collaboration, empathy and the role.' },
  { n: 4, t: 'Founding term', d: 'Selected members join an initial 8–12 week founding term with clear deliverables and a review at the end.' }
];
const STEPS = ['Hello', 'About you', 'Role', 'Experience', 'Challenge', 'Availability', 'Review'];
const MODES = [['remote', 'Remote'], ['in-person', 'In person in Singapore'], ['either', 'Either']];
const LABELS = { name: 'Name', email: 'Email', pronouns: 'Pronouns', age: 'Age band', area: 'Based in', doing: 'Currently', making: 'Loves making', why: 'Why TLLC', role1: 'First choice', role2: 'Second choice', experience: 'Experience', link: 'Link', challenge: 'Challenge answer', hours: 'Hours a week', start: 'Could start', mode: 'How you would take part', commitments: 'Other commitments', access: 'Accessibility' };
const AGE_LABEL = { 'under-16': 'Under 16', '16-17': '16–17', '18-24': '18–24', '25-plus': '25 and above' };
const BLANK = { name: '', email: '', pronouns: '', age: '', area: '', doing: '', making: '', why: '', role1: '', role2: '', experience: '', link: '', challenge: '', hours: '', start: '', mode: '', commitments: '', access: '', truth: false, contact: false, privacy: false, guardian: false };
const isMinor = (age) => age === 'under-16' || age === '16-17';
const roleTitle = (id) => (ROLES.find((r) => r.id === id) || { title: '' }).title;

function validate(step, d) {
  const e = {};
  if (step === 0) {
    if (!d.name.trim()) e.name = 'Please tell us what to call you.';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email.trim())) e.email = 'Please enter a valid email address.';
    if (!d.age) e.age = 'Please choose an age band.';
    if (!d.area) e.area = 'Please choose one.';
  } else if (step === 1) {
    if (d.why.trim().length < 20) e.why = 'A sentence or two is plenty (at least 20 characters).';
  } else if (step === 2) {
    if (!d.role1) e.role1 = 'Please choose a first choice.';
  } else if (step === 3) {
    if (d.experience.trim().length < 20) e.experience = 'Tell us a little about what you have tried (at least 20 characters).';
    if (d.link.trim() && !/^https:\/\/[^\s]+\.[^\s]+$/.test(d.link.trim())) e.link = 'Links need to start with https://';
  } else if (step === 4) {
    if (d.challenge.trim().length < 30) e.challenge = 'Please write at least a couple of sentences (30 characters or more).';
  } else if (step === 5) {
    if (!d.hours) e.hours = 'Please choose one.';
    if (!d.mode) e.mode = 'Please choose how you would like to take part.';
  } else if (step === 6) {
    if (!d.truth || !d.contact || !d.privacy || (isMinor(d.age) && !d.guardian)) e.consent = 'Please tick each box above so we can consider your application.';
  }
  return e;
}


// ---- Flip cards (founding plan copy). Mascot art: emoji motifs for now; swap each `m` for a mascot image when the role artwork is ready.
const CARDS = [
  { id: 'vp', title: 'Vice President', sub: 'Operations & Governance', tone: 'pink', m: ['📋', '📓', '🗓️', '✉️', '🌼'],
    line: 'Helping good ideas become organised, sustainable plans.',
    scope: ['Support the Founder & President in running TLLC', 'Coordinate across departments and projects', 'Help set priorities, timelines and internal processes', 'Maintain organisational structure and accountability', 'Support governance, documentation and meeting follow-ups', 'Step in when cross-team coordination is needed'],
    commit: 'Approx. 3–5 hours per week', commit2: 'May increase around major launches, events or recruitment periods',
    looking: ['Organised and dependable', 'Comfortable coordinating people', 'Thoughtful decision-maker', 'Proactive communicator', 'Able to balance multiple priorities', 'Willing to build systems from the ground up'],
    fit: 'Planning, operations, structure, coordination, project management' },
  { id: 'people', title: 'Head of People', sub: 'Volunteers & Community', tone: 'sage', m: ['💐', '🏷️', '💗', '✅', '🌷'],
    line: 'Making TLLC feel warm, welcoming and well-supported.',
    scope: ['Support volunteer recruitment and onboarding', 'Maintain the Little Creators Community', 'Help volunteers feel included and informed', 'Coordinate attendance, availability and engagement', 'Support recognition, feedback and volunteer wellbeing', 'Help build team culture and community guidelines'],
    commit: 'Approx. 2–4 hours per week', commit2: 'May increase during recruitment and onboarding periods',
    looking: ['Empathetic and approachable', 'Reliable communicator', 'Comfortable checking in with people', 'Organised with basic admin', 'Interested in community-building', 'Able to handle information responsibly'],
    fit: 'People, community, onboarding, volunteer management, culture-building' },
  { id: 'programmes', title: 'Head of Programmes', sub: 'Projects & Events', tone: 'sun', m: ['🗺️', '✂️', '🌸', '📆', '🎈'],
    line: 'Turning little ideas into meaningful community experiences.',
    scope: ['Design and coordinate TLLC programmes and activities', 'Develop project plans, session flows and volunteer roles', 'Work closely with community partners', 'Prepare materials, schedules and logistics', 'Support facilitation and post-project reflection', 'Help review what worked and improve future programmes'],
    commit: 'Approx. 3–5 hours per week', commit2: 'Higher around active events or collection periods',
    looking: ['Creative but practical', 'Comfortable planning events', 'Able to think about participant needs', 'Calm under pressure', 'Collaborative', 'Attentive to logistics and accessibility'],
    fit: 'Events, facilitation, programme design, logistics, community work' },
  { id: 'creative', title: 'Head of Creative', sub: 'Art & Design', tone: 'sky', m: ['🎨', '🎀', '🖌️', '💌', '🌼'],
    line: 'Shaping the little details that make TLLC feel like TLLC.',
    scope: ['Guide TLLC’s visual and creative direction', 'Develop letter, craft and workshop concepts', 'Create or review visual assets for projects', 'Maintain consistency across physical and digital materials', 'Support social content and campaign design', 'Help volunteers translate ideas into simple, accessible creations'],
    commit: 'Approx. 2–4 hours per week', commit2: 'May increase during launches and campaign production',
    looking: ['Strong visual sense', 'Creative and thoughtful', 'Comfortable giving constructive feedback', 'Able to work within a shared brand system', 'Interested in handmade and digital design', 'Portfolio helpful but not required'],
    fit: 'Illustration, crafts, design, branding, stationery, visual storytelling' },
  { id: 'partnerships', title: 'Head of Partnerships', sub: 'Outreach & Collaborations', tone: 'pink', m: ['🤝', '✉️', '🌺', '📇', '✉️'],
    line: 'Building thoughtful relationships beyond TLLC.',
    scope: ['Reach out to community organisations and collaborators', 'Build and maintain partnership relationships', 'Support proposals, follow-ups and meeting preparation', 'Coordinate sponsorship and in-kind support enquiries', 'Help translate partner needs into realistic TLLC projects', 'Keep partnership records organised'],
    commit: 'Approx. 2–4 hours per week', commit2: 'May increase when developing active collaborations',
    looking: ['Confident but respectful communicator', 'Professional in email and meetings', 'Comfortable with follow-up', 'Able to listen and adapt', 'Realistic about what TLLC can offer', 'Relationship-focused rather than overly sales-driven'],
    fit: 'Outreach, networking, relationship-building, sponsorships, collaborations' },
  { id: 'digital', title: 'Head of Digital', sub: 'Website, Media & Communications', tone: 'sage', m: ['💻', '📷', '📱', '🔔', '✨'],
    line: 'Helping TLLC’s stories travel a little further.',
    scope: ['Support website content and digital updates', 'Plan and publish social media content', 'Help document TLLC projects responsibly', 'Coordinate digital campaigns and recruitment posts', 'Maintain consistency across online channels', 'Support development of the Little Letterbox and digital tools'],
    commit: 'Approx. 2–4 hours per week', commit2: 'May increase during launches and active campaigns',
    looking: ['Digitally confident', 'Creative communicator', 'Reliable with deadlines', 'Comfortable writing or designing for social platforms', 'Interested in websites, storytelling or content', 'Able to handle media consent and privacy carefully'],
    fit: 'Social media, websites, photography, content, digital storytelling' }
];

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { flipped: {}, step: 0, furthest: 0, d: { ...BLANK }, errors: {}, sent: false }; }
  flip(id) {
    const on = !this.state.flipped[id];
    this.setState({ flipped: { ...this.state.flipped, [id]: on } });
    // Move focus to the visible face's control (after the face becomes visible).
    setTimeout(() => { const el = document.getElementById(on ? 'fc-back-btn-' + id : 'fc-front-' + id); if (el && el.focus) el.focus({ preventScroll: true }); }, 260);
  }
  applyFor(id) {
    if (CLOSED.includes(id)) return;
    this.setField('role1', id);
    const t = document.getElementById('apply');
    if (t && t.scrollIntoView) { const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; t.scrollIntoView({ behavior: calm ? 'auto' : 'smooth', block: 'start' }); }
  }
  setField(k, val) { this.setState({ d: { ...this.state.d, [k]: val }, errors: { ...this.state.errors, [k]: undefined, consent: undefined } }); }
  goto(n) { const s = this.state; if (n <= s.furthest) this.setState({ step: n, errors: {} }); }
  next() {
    const s = this.state; const e = validate(s.step, s.d);
    if (Object.keys(e).length) { this.setState({ errors: e }); return; }
    const step = Math.min(s.step + 1, STEPS.length - 1);
    this.setState({ step, furthest: Math.max(s.furthest, step), errors: {} });
  }
  back() { if (this.state.step > 0) this.setState({ step: this.state.step - 1, errors: {} }); }
  send() {
    const s = this.state; let e = {};
    for (let i = 0; i < STEPS.length; i++) { const x = validate(i, s.d); if (Object.keys(x).length) { this.setState({ step: i, errors: x }); return; } e = x; }
    // Integration point: POST the validated answers to the recruitment endpoint (see the backend
    // package: /api/applications/exco). Only show the confirmation once that request succeeds.
    this.setState({ sent: true, errors: {} });
  }
  renderVals() {
    const s = this.state; const d = s.d; const e = s.errors; const step = s.step;
    const fields = Object.keys(BLANK);
    const h = {}; fields.forEach((k) => { h[k] = typeof BLANK[k] === 'boolean' ? (ev) => this.setField(k, ev.target.checked) : (ev) => this.setField(k, ev.target.value); });
    const secondRoles = ROLES.filter((r) => r.id !== d.role1 && r.id !== 'unsure' && !CLOSED.includes(r.id));
    const review = [];
    const add = (k, val) => { if (val && String(val).trim()) review.push({ label: LABELS[k], value: String(val), edit: () => this.goto({ name: 0, email: 0, pronouns: 0, age: 0, area: 0, doing: 1, making: 1, why: 1, role1: 2, role2: 2, experience: 3, link: 3, challenge: 4, hours: 5, start: 5, mode: 5, commitments: 5, access: 5 }[k]) }); };
    add('name', d.name); add('email', d.email); add('pronouns', d.pronouns); add('age', AGE_LABEL[d.age]); add('area', d.area); add('doing', d.doing); add('making', d.making); add('why', d.why);
    add('role1', roleTitle(d.role1)); add('role2', roleTitle(d.role2)); add('experience', d.experience); add('link', d.link); add('challenge', d.challenge);
    add('hours', d.hours && d.hours.replace('-plus', '+').replace('-', '–') + ' hours'); add('start', d.start); add('mode', (MODES.find((m) => m[0] === d.mode) || [])[1]); add('commitments', d.commitments); add('access', d.access);
    return {
      showForm: !s.sent, sentView: s.sent,
      stepNo: step + 1, stepTotal: STEPS.length, stepName: STEPS[step], pct: Math.round((step) / (STEPS.length - 1) * 100), bar: 'width: ' + Math.round(((step + 1) / STEPS.length) * 100) + '%',
      steps: STEPS.map((label, i) => ({ n: i + 1, label, cls: 'ex-steps__i' + (i === step ? ' is-current' : i < step ? ' is-done' : ''), cur: i === step ? 'step' : undefined, locked: i > s.furthest, go: () => this.goto(i) })),
      s0: step === 0, s1: step === 1, s2: step === 2, s3: step === 3, s4: step === 4, s5: step === 5, s6: step === 6,
      v: d, h, e, n: { why: d.why.length, experience: d.experience.length, challenge: d.challenge.length },
      cards: CARDS.map((c) => {
        const on = !!this.state.flipped[c.id];
        return {
          ...c, cls: 'fc fc--' + c.tone + (on ? ' is-flipped' : ''), expanded: on ? 'true' : 'false',
          frontId: 'fc-front-' + c.id, backId: 'fc-back-' + c.id, backBtnId: 'fc-back-btn-' + c.id,
          m0: c.m[0], m1: c.m[1], m2: c.m[2], m3: c.m[3], m4: c.m[4],
          toggle: () => this.flip(c.id), apply: () => this.applyFor(c.id), key: (ev) => { if (ev.key === 'Escape' && on) this.flip(c.id); },
          isClosed: CLOSED.includes(c.id), applyLabel: CLOSED.includes(c.id) ? 'Seat filled' : 'Apply for ' + c.title, chosen: d.role1 === c.id && !CLOSED.includes(c.id)
        };
      }),
      roles1: ROLES.map((r) => { const closed = CLOSED.includes(r.id); return { ...r, isClosed: closed, hours: closed ? 'Seat filled' : r.hours, hasHours: closed || !!r.hours, on: d.role1 === r.id, cls: 'role' + (d.role1 === r.id ? ' is-on' : '') + (closed ? ' is-closed' : ''), pick: () => { if (!closed) this.setField('role1', r.id); } }; }),
      roles2: secondRoles,
      modes: MODES.map(([id, label]) => ({ label, on: d.mode === id, pick: () => this.setField('mode', id) })),
      challenge: (EXERCISES[d.role1] || { text: CHALLENGE }).text, chalTitle: (EXERCISES[d.role1] || { title: 'Write a kind note' }).title, isSample: !EXERCISES[d.role1], notSample: !!EXERCISES[d.role1], process: PROCESS, review, minor: isMinor(d.age),
      atStart: step === 0, notLast: step < STEPS.length - 1, isLast: step === STEPS.length - 1,
      next: () => this.next(), back: () => this.back(), send: () => this.send(), onEnter: (ev) => { ev.preventDefault(); if (step < STEPS.length - 1) this.next(); },
      backToReview: () => this.setState({ sent: false, step: STEPS.length - 1 })
    };
  }
}

return Component;
});
TLLC.start("Exco", document.getElementById('app'));
</script>
