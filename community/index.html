      // "thank you for subscribing" message once it succeeds. Record both consent ticks with a timestamp.
      submit: (e) => {

        { id: 'supportus', label: 'Support Us', hint: 'The Little Giving Circle', href: '/supportus/' },
        { id: 'getinvolved', label: 'All ways to help', hint: 'Volunteer, join the team, partner, attend', href: '/getinvolved/', all: true }
      ] },
      { id: 'chapters', label: 'Chapters', items: [
        { id: 'chapters', label: 'Our Chapters', hint: 'One little world, many communities', href: '/chapters/' },
        { id: 'chapters-sg', label: '🇸🇬 Singapore', hint: 'Home Chapter', href: '/about/' },
        { id: 'india', label: '🇮🇳 India', hint: 'Forming', href: '/india/' },
        { id: 'chapters-start', label: '＋ Start a Chapter', hint: 'Tell us where the next letter should travel', href: '/contact/' }
      ] },
      { id: 'lbx', label: 'Letterbox', items: [
        { id: 'letterbox', label: 'Create a Letter', hint: 'Write and decorate an e-letter', href: '/letterbox/#studio' },
        { id: 'myletters', label: 'My Letters', hint: 'Your saved and sent letters', soon: true },
        { id: 'lbarchive', label: 'Community Archive', hint: 'Letters shared with permission', soon: true },
        { id: 'lbhow', label: 'How It Works', hint: 'From draft to delivery', soon: true }
      ] },
      { id: 'more', label: 'Explore', items: [
        { id: 'journal', label: 'Journal', hint: 'Stories, ideas and prompts', href: '/journal/' },
        { id: 'impact', label: 'Our Impact', hint: 'Verified figures only', href: '/remote/#impact' },
        { id: 'gallery', label: 'Little Moments', hint: 'Our Polaroid gallery', href: '/gallery/' },
        { id: 'scrapbook', label: 'Our Little Scrapbook', hint: 'Moments from our little corner', soon: true }
      ] },
      { id: 'contact', label: 'Contact', href: '/contact/' }
    ];
    const groups = tree.map((g) => {
      if (!g.items) return { label: g.label, href: g.href, isLink: true, isMenu: false, cur: g.id === current ? 'page' : undefined };
      const inGroup = g.items.some((i) => i.id === current);
      const isOpen = this.state.group === g.id;
      return {
        label: g.label, isLink: false, isMenu: true, cur: inGroup ? 'true' : undefined, show: isOpen, expanded: isOpen ? 'true' : 'false',
        toggle: () => this.setState({ group: isOpen ? null : g.id }),
        items: g.items.map((i) => ({ ...i, live: !i.soon, soon: !!i.soon, liCls: i.all ? 'dd__all' : '', cur: i.id === current ? 'page' : undefined }))
      };
    });
    const open = this.state.open;
    return {
      groups,
      open,
      expanded: open ? 'true' : 'false',
      menuLabel: open ? 'Close menu' : 'Open menu',
      toggle: () => this.setState({ open: !this.state.open })
    };
  }
}

return Component;
});

// Verified impact only: set `value` (a number or short text) once it can be evidenced from records.
const MEASURES = [
  { label: 'Completed partner-approved collections', value: null },
  { label: 'Active community partnerships', value: null },
  { label: 'Unique participating volunteers', value: null },
  { label: 'Volunteers who return', value: null },
  { label: 'Approved creations delivered', value: null },
  { label: 'Creative sessions held', value: null },
  { label: 'Partner feedback', value: null },
  { label: 'Volunteer learning and satisfaction', value: null }
];
// Project archive. Move a project to COMPLETED only after partner-managed handover is recorded.
const PLANNED = [
  { no: 'Collection No. 001', title: 'The Sunshine Letters Project', status: 'Planning stage', href: '/collection/', summary: 'Proposed: warm, illustrated cards for seniors in Singapore. Partner not confirmed.' }
];
const COMPLETED = [];

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sent: false }; }
  renderVals() {
    return {
      measures: MEASURES.map((m) => ({ ...m, display: m.value == null ? 'Not yet reported' : String(m.value) })),
      planned: PLANNED,
      completed: COMPLETED,
      noCompleted: COMPLETED.length === 0,
      sent: this.state.sent,
      // Integration point: send `new FormData(e.target)` to the partnership form service here.
      submit: (e) => { e.preventDefault(); this.setState({ sent: true }); }
    };
  }
}

return Component;
});
TLLC.start("Community", document.getElementById('app'));
