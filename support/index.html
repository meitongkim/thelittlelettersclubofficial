nce, protect recipient privacy, use suitable materials, seek permission for photographs and take part in community visits only when they are organised and supervised through an approved partner. We do not support unsupervised direct contact between volunteers and recipients."]],"\n",["p",{"class":"llc-caption"},["Specific procedures and emergency contacts will be formally adopted before activities begin. Safeguarding lead: ",["span",{"class":"ph"},["[TO BE NAMED]"]]]],"\n"]],"\n"]],"\n"]],"\n\n",["section",{"id":"privacy","class":"sec","aria-labelledby":"priv-title"},["\n",["div",{"class":"wrap"},["\n",["div",{"class":"sp-policy sp-policy--4"},["\n",["article",{"class":"llc-card"},["\n",["span",{"class":"status status--planned","style":"align-self: flex-start"},["Pending review"]],"\n",["h2",{"id":"priv-title","class":"llc-h3"},["Privacy Notice"]],"\n",["p",{"class":"llc-body"},["Our full privacy notice is being prepared and will be reviewed for Singapore requirements before we collect any personal information. It will explain what we collect and why, how guardian consent works, how long we keep it, and how to access, correct or withdraw it."]],"\n",["p",{"class":"llc-body"},[["strong",{},["Until then, the forms on this site are prototypes: they do not send or store anything."]]]],"\n",["p",{"class":"llc-caption sp-foot"},["Privacy contact: ",["span",{"class":"ph"},["[PRIVACY_CONTACT]"]]]],"\n"]],"\n",["article",{"id":"terms","class":"llc-card"},["\n",["span",{"class":"status status--planned","style":"align-self: flex-start"},["Pending review"]],"\n",["h2",{"class":"llc-h3"},["Terms of Use"]],"\n",["p",{"class":"llc-body"},["Our terms of use will be published after review. TLLC is a youth-led initiative, not a registered charity, and does not currently invite or accept public financial donations."]],"\n"]],"\n",["article",{"id":"whistleblowing","class":"llc-card llc-card--blush"},["\n",["span",{"class":"status status--planned","style":"align-self: flex-start"},["Pending review"]],"\n",["h2",{"class":"llc-h3"},["Whistleblowing Policy"]],"\n",["p",{"class":"llc-body"},["Anyone (a volunteer, partner, parent or member of the public) can raise a concern about wrongdoing linked to TLLC, such as misuse of funds or materials, unsafe conduct, harassment, or mishandling of personal information."]],"\n",["p",{"class":"llc-body"},["Concerns will be handled in confidence by someone not involved in the matter, and no one will be treated unfairly for raising a concern in good faith. If someone may be in immediate danger, contact the police (999) first."]],"\n",["p",{"class":"llc-body"},["Our full policy, including who reviews reports and how long each step takes, will be adopted before activities begin."]],"\n",["p",{"class":"llc-caption sp-foot"},["Raise a concern: ",["span",{"class":"ph"},["[WHISTLEBLOWING_CONTACT]"]],". Until it is set up, email ",["a",{"class":"txt","href":"mailto:hello@thelittlelettersclub.org?subject=Confidential%20concern"},["hello@thelittlelettersclub.org"]]," with \"Confidential concern\" in the subject."]],"\n"]],"\n",["article",{"id":"accessibility","class":"llc-card llc-card--sky"},["\n",["h2",{"class":"llc-h3"},["Accessibility"]],"\n",["p",{"class":"llc-body"},["We aim for readable text contrast, visible keyboard focus, labelled forms and reduced motion where requested. If something on this site is hard to use, please ",["a",{"class":"txt","href":"/contact/"},["tell us"]]," so we can fix it."]],"\n"]],"\n"]],"\n"]],"\n"]],"\n\n"]],"\n",["div",{"style":"margin-top: auto"},[["dc-import",{"name":"Footer","hint-size":"100%,480px"},[]]]],"\n"]],"\n"]</script>

TLLC.define("Footer", function (DCLogic) {

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: false, sent: false, err: '' }; }
  openSub(email) {
    try { this.lastFocus = document.activeElement; } catch (e) {}
    this.setState({ open: true, sent: false, err: '' }, () => {
      try {
        const em = document.getElementById('sub-email'); if (em && email) em.value = email;
        const f = document.getElementById('sub-first'); f && f.focus();
      } catch (e) {}
    });
  }
  closeSub() { this.setState({ open: false }, () => { try { this.lastFocus && this.lastFocus.focus && this.lastFocus.focus(); } catch (e) {} }); }
  renderVals() {
    return {
      open: this.state.open, sent: this.state.sent, notSent: !this.state.sent, err: this.state.err,
      openSub: () => this.openSub(''),
      quick: (e) => { e.preventDefault(); const v = (e.target.elements.email || {}).value || ''; this.openSub(v); },
      close: () => this.closeSub(),
      backdrop: (e) => { if (e.target === e.currentTarget) this.closeSub(); },
      key: (e) => {
        if (e.key === 'Escape') { e.preventDefault(); this.closeSub(); }
        else if (e.key === 'Tab') { // keep focus inside the dialog
          const panel = document.querySelector('.sub-panel'); if (!panel) return;
          const els = panel.querySelectorAll('button, a[href], input, [tabindex]:not([tabindex="-1"])');
          const first = els[0], last = els[els.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      },
      // Integration point: send these fields to the mailing-list service, and only show a
      // "thank you for subscribing" message once it succeeds. Record both consent ticks with a timestamp.
      submit: (e) => {
        e.preventDefault();
        const f = e.target.elements;
        if (!f.first.value.trim() || !f.last.value.trim()) return this.setState({ err: 'Please add your first and last name.' });
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email.value.trim())) return this.setState({ err: 'Please enter a valid email address.' });
        if (!f.store.checked) return this.setState({ err: 'Please tick the box to let us store your details, so we can send updates.' });
        this.setState({ sent: true, err: '' }, () => { try { const d = document.getElementById('sub-done'); d && d.focus(); } catch (er) {} });
      }
    };
  }
}

return Component;
});
